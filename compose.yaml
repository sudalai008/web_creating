services:
  backend:
    build:
      context: backend
      target: development
    environment:
      DATABASE_DB: example
      DATABASE_USER: app
      DATABASE_PASSWORD_FILE: /run/secrets/db-password
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      NODE_ENV: production
    ports:
      - "127.0.0.1:8081:80"
    secrets:
      - db-password
    networks:
      - public
      - private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    restart: unless-stopped
    secrets:
      - db-password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - private
    environment:
      MYSQL_DATABASE: example
      MYSQL_USER: app
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-password
    ports:
      - "127.0.0.1:5000:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password="$$(cat /run/secrets/db-password)" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build:
      context: frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:80
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
networks:
  public:
  private:
volumes:
  mysql-data:
secrets:
  db-password:
    file: db/password.txt
